<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홈</title>
</head>
<body>
    <h2>홈 페이지</h2>

    {% if user.is_authenticated %}
        <p>{{ user.nickname }}님 로그인 중입니다</p>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">로그아웃</button>
        </form>

        <a href="{% url 'post_list' %}">
            <button>목록으로</button>
        </a>

        <a href="{% url 'profile' request.user.id %}">
            <button>내 페이지</button>
        </a>
    {% else %}
        <a href="{% url 'login' %}">
            <button>로그인</button>
        </a>
        <a href="{% url 'signup' %}">
            <button>회원가입</button>
        </a>
    {% endif %}
</body>
</html>
