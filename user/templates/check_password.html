<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호확인</title>
</head>
<body>
    <h2>비밀번호 확인</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="password" name="password" placeholder="비밀번호 입력">
        <button type="submit">확인</button>
    </form>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
</body>
</html>
